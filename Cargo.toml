[package]
name = "loom"
version = "0.3.0"
edition = "2024"
description = "Executes Julia, R, and Python code cells in Typst documents"

[[bin]]
name = "loom"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
signal-hook = "0.3"
env_logger = "0.11"
hex = "0.4"
libc = "0.2"
log = "0.4"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
toml = "0.8"
typst-syntax = "0.15.1"

[dev-dependencies]
tempfile = "3"
